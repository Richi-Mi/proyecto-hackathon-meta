openapi: 3.1.0
info:
  title: Smart Abarrotes API
  version: 1.0.9
  description: Backend del sistema híbrido Smart Store (cobro automatizado por cámaras) + POS manual.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Customer, description: Portal del cliente (PWA) }
  - { name: Store Devices, description: Escáner de entrada y sistema de cámaras }
  - { name: Categories }
  - { name: Products }
  - { name: Inventory }
  - { name: Sales }
  - { name: Reports }
  - { name: Settings }
  - { name: Shelf, description: 'ShelfSight: cámara de repisa, eventos antes/después y cola de revisión' }
  - { name: Dev, description: 'Herramientas de demostración; solo existen si NODE_ENV ≠ production o ENABLE_STORE_SIMULATOR=true' }

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [Health]
      summary: Liveness/readiness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [up, down] }

  # ---------------- AUTH ----------------
  /auth/register:
    post:
      operationId: registerCustomer
      security: []
      tags: [Auth]
      summary: Registro de cliente (rol CUSTOMER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      operationId: loginCustomer
      security: []
      tags: [Auth]
      summary: Login de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/admin/login:
    post:
      operationId: loginAdmin
      security: []
      tags: [Auth]
      summary: Login exclusivo de propietario (rechaza CUSTOMER con 403)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- CUSTOMER ----------------
  /me/entry-pass:
    get:
      operationId: getEntryPass
      tags: [Customer]
      summary: Genera el JWT de pase de entrada para el QR (TTL 60 s, un solo uso)
      security: [{ bearerAuth: [CUSTOMER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPass' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/purchases:
    get:
      operationId: listMyPurchases
      tags: [Customer]
      summary: Historial de compras agrupado por fecha
      description: |
        Compras del cliente (automáticas y de mostrador donde se le identificó), más recientes primero.
        La paginación es por compra; luego se agrupan por día en la zona horaria de la tienda. `totalAmount` del grupo excluye las canceladas.
        Rango opcional [from, to); 400 `INVALID_RANGE` si from ≥ to.
      security: [{ bearerAuth: [CUSTOMER] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/purchases/{saleId}:
    get:
      operationId: getMyPurchase
      tags: [Customer]
      summary: Detalle de una compra propia
      description: 404 `PURCHASE_NOT_FOUND` también si la venta existe pero es de otra persona (no se revela su existencia).
      security: [{ bearerAuth: [CUSTOMER] }]
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- STORE DEVICES ----------------
  /store/entry:
    post:
      operationId: registerStoreEntry
      tags: [Store Devices]
      summary: El escáner valida el QR y abre una visita
      description: |
        El escáner se autentica con `X-Device-Key` (una de las llaves de `STORE_DEVICE_KEYS`) y envía el JWT del QR.
        Si el cliente ya tenía una visita ACTIVE (p. ej. salió sin que llegara el webhook), esa visita se marca ABANDONED y se abre una nueva.
        Errores: 401 `INVALID_DEVICE_KEY`, `INVALID_ENTRY_TOKEN` (firma, tipo o expiración) · 403 `ACCOUNT_DISABLED` · 409 `ENTRY_TOKEN_REUSED`.
      security: [{ deviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreEntryRequest' }
      responses:
        '201':
          description: Visita creada (abrir acceso)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreEntryResponse' }
        '401': { description: Token inválido/expirado o device key inválida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Cuenta desactivada (ACCOUNT_DISABLED), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Token ya utilizado (ENTRY_TOKEN_REUSED), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhooks/checkout:
    post:
      operationId: handleCheckoutWebhook
      tags: [Store Devices]
      summary: Webhook de salida del sistema de cámaras → venta AUTOMATED + cobro + descuento de stock
      description: |
        Firma: `X-Signature: sha256=<hex(HMAC_SHA256(WEBHOOK_SECRET, rawBody))>` sobre el cuerpo crudo; se valida antes de leer el JSON.
        Idempotente por `eventId`: un reintento devuelve la misma respuesta con 200.
        Si `items` está vacío se cierra la visita sin venta (`saleId: null`, `folio: null`, `totalAmount: 0`, `paymentStatus: null`).
        La venta es AUTOMATED con `CARD_ON_FILE`, fecha = `exitedAt` y los precios vigentes del producto. **No se rechaza por stock** (puede quedar negativo) ni por producto INACTIVE: la mercancía ya salió.
        Cada partida identifica el producto por `productId` (SKU) o `barcode`; las repetidas se suman.
        El cobro se intenta después de registrar la venta: `PAID` o `FAILED` (adeudo visible en `pendingPayments` de `/reports/summary`).
        Errores: 400 `VALIDATION_ERROR`, `INVALID_BODY`, `ITEM_CODE_REQUIRED`, `INVALID_EXITED_AT` (antes de la entrada o en el futuro) · 401 `INVALID_SIGNATURE` · 404 `VISIT_NOT_FOUND`, `PRODUCT_NOT_FOUND` · 409 `VISIT_CLOSED` (visita cerrada o abandonada), `EVENT_ID_CONFLICT` (el `eventId` ya cerró otra visita).
      security: [{ webhookSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutWebhookRequest' }
      responses:
        '200':
          description: Procesado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutWebhookResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Firma inválida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Visita o producto desconocido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Visita ya cerrada con otro eventId (VISIT_CLOSED) o eventId de otra visita (EVENT_ID_CONFLICT), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- DEV ----------------
  /dev/simulate-visit:
    post:
      operationId: simulateStoreVisit
      tags: [Dev]
      summary: Simula una visita completa del cliente demo (entrada con QR + salida con productos al azar)
      description: |
        Solo existe si `NODE_ENV ≠ production` o si el servidor arranca con `ENABLE_STORE_SIMULATOR=true` (demo en producción). Usa al cliente `SEED_CUSTOMER_EMAIL`, elige de 1 a 4 productos activos (con stock si los hay)
        y ejecuta los mismos casos de uso que `/store/entry` y `/webhooks/checkout`, incluido el cobro simulado.
        Errores: 404 `SIMULATION_CUSTOMER_NOT_FOUND` · 422 `NO_PRODUCTS_AVAILABLE`.
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: Visita simulada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatedVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: NO_PRODUCTS_AVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- CATEGORIES ----------------
  /categories:
    get:
      operationId: listCategories
      summary: Lista categorías
      tags: [Categories]
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCategory
      summary: Crea categoría
      tags: [Categories]
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCategory
      summary: Edita categoría (parcial)
      tags: [Categories]
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Elimina categoría (409 si tiene productos)
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- PRODUCTS ----------------
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: Lista paginada con búsqueda y filtros (tabla de inventario y catálogo POS)
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: search, in: query, schema: { type: string }, description: 'Nombre, SKU o código de barras' }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: lowStock, in: query, schema: { type: boolean }, description: 'stock <= min_stock_alert' }
        - { name: quickAccess, in: query, schema: { type: boolean }, description: Solo productos del grid del POS }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, stock, -stock, price, -price, updatedAt, -updatedAt], default: name } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProduct
      summary: Crea producto
      description: 'Errores 400 de negocio: CATEGORY_NOT_FOUND. Errores 409: PRODUCT_ALREADY_EXISTS (incluye SKU de productos dados de baja), BARCODE_ALREADY_EXISTS.'
      tags: [Products]
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/lookup:
    get:
      operationId: lookupProduct
      tags: [Products]
      summary: Búsqueda exacta por código de barras o SKU (lector del POS)
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: SKU }
    get:
      operationId: getProduct
      summary: Detalle de producto
      tags: [Products]
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateProduct
      tags: [Products]
      summary: Edita producto (el stock NO se edita aquí; usar stock-adjustments)
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteProduct
      tags: [Products]
      summary: Baja lógica (soft delete; conserva historial de ventas)
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{id}/stock-adjustments:
    post:
      operationId: createStockAdjustment
      tags: [Inventory]
      summary: Entrada de mercancía o ajuste manual de stock
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustmentRequest' }
      responses:
        '201':
          description: Movimiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryMovement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'INSUFFICIENT_STOCK: un ADJUSTMENT no puede dejar el stock en negativo', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- INVENTORY ----------------
  /inventory/summary:
    get:
      operationId: getInventorySummary
      tags: [Inventory]
      summary: KPIs del dashboard de inventario
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventorySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [Inventory]
      summary: Kardex / auditoría de movimientos
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: productId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/MovementType' } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/InventoryMovement' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- SALES ----------------
  /sales:
    get:
      operationId: listSales
      tags: [Sales]
      summary: Historial cronológico de tickets
      description: Rango opcional [from, to); 400 `INVALID_RANGE` si from ≥ to. Incluye ventas canceladas salvo que se filtre por `status`.
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SaleStatus' } }
        - { name: paymentMethod, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: folio, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK (orden date_time DESC)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SaleSummary' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createManualSale
      tags: [Sales]
      summary: Venta MANUAL desde el POS (precios e impuestos recalculados en servidor)
      description: |
        Las partidas repetidas del mismo producto se suman. Precio, costo y tasa se toman del producto (bloqueado durante la venta) y se copian a cada partida.
        Errores: 400 `CASH_RECEIVED_REQUIRED`, `CUSTOMER_NOT_FOUND` · 404 `PRODUCT_NOT_FOUND` · 409 `INSUFFICIENT_STOCK` (details: productId, requested, available), `PRODUCT_INACTIVE` · 422 `CASH_INSUFFICIENT`.
        Con tarjeta o transferencia `cashReceived` se ignora. Repetir la misma `Idempotency-Key` devuelve la venta original.
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid }, description: Evita doble cobro por doble clic }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualSaleRequest' }
      responses:
        '201':
          description: Venta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: INSUFFICIENT_STOCK o PRODUCT_INACTIVE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'CASH_INSUFFICIENT (cashReceived < total)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sales/{id}:
    get:
      operationId: getSale
      summary: Detalle de venta
      tags: [Sales]
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sales/{id}/receipt:
    get:
      operationId: getSaleReceipt
      tags: [Sales]
      summary: Datos del ticket para (re)impresión
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sales/{id}/cancel:
    post:
      operationId: cancelSale
      tags: [Sales]
      summary: Cancela la venta completa, repone stock y reembolsa (CARD_ON_FILE vía gateway)
      description: |
        En una transacción: repone el stock de cada partida con un movimiento `CANCELLATION` en el kardex y marca la venta como CANCELLED (fecha, usuario y motivo).
        `paymentStatus` pasa de PAID a REFUNDED; los cobros PENDING o FAILED conservan su estado. 400 `INVALID_REASON` si el motivo tiene menos de 3 caracteres.
        Si el pago fue `CARD_ON_FILE` y estaba PAID, el reembolso se pide a la pasarela dentro de la misma transacción: si la pasarela lo rechaza, responde 422 `REFUND_FAILED` y la venta queda sin cancelar.
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelSaleRequest' }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SALE_ALREADY_CANCELLED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: REFUND_FAILED (la pasarela rechazó el reembolso), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- REPORTS ----------------
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [Reports]
      summary: Métricas clave en un rango (el dashboard pide hoy y semana)
      description: |
        Rango semiabierto [from, to) sobre ventas COMPLETED (las canceladas no cuentan). Errores 400: `INVALID_RANGE` (from ≥ to o fecha inválida), `RANGE_TOO_LARGE` (más de 400 días).
        `revenue` incluye ventas con cobro pendiente o fallido; esas además se suman en `pendingPayments`.
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/sales-trend:
    get:
      operationId: getSalesTrend
      summary: Serie temporal de ventas y ganancia
      description: |
        Rango semiabierto [from, to) sobre ventas COMPLETED (las canceladas no cuentan). Errores 400: `INVALID_RANGE` (from ≥ to o fecha inválida), `RANGE_TOO_LARGE` (más de 400 días), o más de 1000 puntos para la granularidad elegida.
        Los periodos se truncan en la zona horaria de la tienda (`STORE_TIMEZONE`, por defecto America/Mexico_City; semanas desde el lunes) y `bucket` es el instante de inicio del periodo. Los periodos sin ventas se incluyen en cero.
      tags: [Reports]
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month], default: day } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [Reports]
      summary: Productos de mayor rotación
      description: |
        Rango semiabierto [from, to) sobre ventas COMPLETED (las canceladas no cuentan). Errores 400: `INVALID_RANGE` (from ≥ to o fecha inválida), `RANGE_TOO_LARGE` (más de 400 días).
        `revenue` es IVA incluido; `netProfit` = Σ base sin IVA − Σ costo (snapshot de cada partida). Empates por nombre.
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
        - { name: by, in: query, schema: { type: string, enum: [quantity, revenue, profit], default: quantity } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TopProduct' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- SETTINGS ----------------
  /settings:
    get:
      operationId: getSettings
      summary: Configuración general del negocio
      description: Si la tienda aún no se configuró, devuelve los valores por defecto (sin `updatedAt`).
      tags: [Settings]
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateSettings
      summary: Actualiza configuración general
      description: |
        Actualización parcial: los campos omitidos conservan su valor (no se aplican defaults).
        Los textos se recortan; `legalName`, `phone` o `ticketFooter` vacíos se guardan como `null` y el RFC se guarda en mayúsculas.
        En `peripherals` se reemplaza cada dispositivo enviado (`printer`, `barcodeScanner`, `cardTerminal`) y los omitidos conservan su configuración.
        Los cambios de perfil se reflejan en los tickets (`GET /sales/{id}/receipt`) y `defaultTaxRate` en las altas de producto sin `taxRate`.
      tags: [Settings]
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSettingsUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSettings' }
        '400':
          description: Validación fallida (`VALIDATION_ERROR`, p. ej. RFC con formato inválido)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- SHELF (ShelfSight) ----------------
  /shelf/vision:
    get:
      operationId: getShelfVisionStatus
      tags: [Shelf]
      summary: Modelo de visión configurado y reglas de aplicación automática
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelfVisionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shelf-events:
    post:
      operationId: createShelfEvent
      tags: [Shelf]
      summary: Interacción con la repisa (foto antes/después) → visión → movimiento de inventario o revisión
      description: |
        La cámara (un teléfono con la sesión del dueño) envía la foto de antes y la de después de una interacción.
        El servidor pide al modelo de visión qué producto del catálogo cambió y cuántas piezas.
        Se aplica solo si el producto existe, la confianza ≥ `autoApplyConfidence`, la cantidad ≤ `maxAutoQuantity`
        y (en una salida) hay stock suficiente. Salida = movimiento ADJUSTMENT negativo; entrada = RESTOCK.
        Si no, queda en `PENDING_REVIEW` con `reviewReason` y el stock no cambia. Sin modelo configurado, todo va a revisión.
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfEventCreateRequest' }
      responses:
        '201':
          description: Evento registrado (aplicado, sin cambio o en revisión)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelfEvent' }
        '400': { description: 'VALIDATION_ERROR | INVALID_IMAGE | INVALID_CAPTURED_AT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listShelfEvents
      tags: [Shelf]
      summary: Bitácora de eventos de repisa (más recientes primero)
      security: [{ bearerAuth: [OWNER] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShelfEventStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ShelfEvent' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shelf-events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getShelfEvent
      tags: [Shelf]
      summary: Detalle de un evento con sus fotos
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelfEventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SHELF_EVENT_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /shelf-events/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmShelfEvent
      tags: [Shelf]
      summary: El dueño confirma o corrige el evento y se aplica al inventario
      description: Solo para eventos `PENDING_REVIEW` o `NO_CHANGE`. Los datos enviados reemplazan lo que interpretó la visión.
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfEventConfirmRequest' }
      responses:
        '200':
          description: Evento aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelfEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'SHELF_EVENT_NOT_FOUND | PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'SHELF_EVENT_RESOLVED | INSUFFICIENT_STOCK', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /shelf-events/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectShelfEvent
      tags: [Shelf]
      summary: El dueño descarta el evento (el stock no cambia)
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: Evento descartado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelfEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: SHELF_EVENT_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: SHELF_EVENT_RESOLVED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /shelf/visit:
    get:
      operationId: getCurrentStoreVisit
      tags: [Shelf]
      summary: Cliente dentro de la tienda y su carrito (lo que la cámara le vio tomar)
      description: La visita ACTIVE más reciente; ShelfSight asume un cliente a la vez frente a la repisa. `visit` es null si no hay nadie.
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shelf/visit/checkout:
    post:
      operationId: checkoutCurrentStoreVisit
      tags: [Shelf]
      summary: El dueño cobra la salida del cliente que está en la tienda
      description: Respaldo de `POST /me/visit/checkout`. Mismo resultado que el webhook de salida, con las partidas del carrito.
      security: [{ bearerAuth: [OWNER] }]
      responses:
        '200':
          description: Visita cerrada (con venta si el carrito tenía piezas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitCheckout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'NO_ACTIVE_VISIT | PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'VISIT_CLOSED | EVENT_ID_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /store/door-entry:
    post:
      operationId: registerDoorEntry
      tags: [Store Devices]
      summary: 'Puerta operada por el dueño: lee el QR del cliente con la cámara y abre su visita'
      description: Igual que `POST /store/entry`, pero autenticado con la sesión del dueño en lugar de `X-Device-Key` (la puerta es una laptop o teléfono con el panel abierto).
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreEntryRequest' }
      responses:
        '201':
          description: Visita abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'No autenticado | INVALID_ENTRY_TOKEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Rol insuficiente | ACCOUNT_DISABLED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'ENTRY_TOKEN_REUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /products/identify:
    post:
      operationId: identifyProduct
      tags: [Products]
      summary: 'Caja: identifica un producto con una foto (en lugar del lector de código de barras)'
      security: [{ bearerAuth: [OWNER] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductIdentifyRequest' }
      responses:
        '200':
          description: Resultado; `product` es null si no lo reconoció
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductIdentification' }
        '400': { description: 'VALIDATION_ERROR | INVALID_IMAGE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'VISION_UNAVAILABLE | VISION_ERROR', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/visit:
    get:
      operationId: getMyVisit
      tags: [Customer]
      summary: Mi visita activa y lo que llevo en el carrito
      security: [{ bearerAuth: [CUSTOMER] }]
      responses:
        '200':
          description: OK; `visit` es null si no estoy en la tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/visit/checkout:
    post:
      operationId: checkoutMyVisit
      tags: [Customer]
      summary: 'Salgo de la tienda: se cobra mi carrito con mi método guardado'
      description: Idempotente por visita (un doble toque no cobra dos veces). Sin piezas, cierra la visita sin venta.
      security: [{ bearerAuth: [CUSTOMER] }]
      responses:
        '200':
          description: Visita cerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitCheckout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'NO_ACTIVE_VISIT | PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'VISIT_CLOSED | EVENT_ID_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT de sesión (HS256, TTL 8h). Claims: sub, role. Los scopes [OWNER]/[CUSTOMER] indican el rol requerido.'
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    FromRequired: { name: from, in: query, required: true, schema: { type: string, format: date-time } }
    ToRequired: { name: to, in: query, required: true, schema: { type: string, format: date-time } }

  responses:
    BadRequest: { description: Validación fallida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: No autenticado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Rol insuficiente, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflicto (duplicado / estado inválido), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Money: { type: number, minimum: 0, description: 'MXN. El servidor redondea a 2 decimales (half away from zero).' }
    TaxRate: { type: number, minimum: 0, maximum: 1, examples: [0, 0.16] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR, INSUFFICIENT_STOCK, ENTRY_TOKEN_REUSED] }
            message: { type: string }
            details: {}
            traceId: { type: string, description: Trace ID de OpenTelemetry }
    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Role: { type: string, enum: [OWNER, CUSTOMER] }
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: segundos }
        user: { $ref: '#/components/schemas/User' }
    EntryPass:
      type: object
      required: [token, expiresAt, refreshInSeconds]
      properties:
        token: { type: string, description: 'JWT {sub, typ:"entry", jti, iat, exp}' }
        expiresAt: { type: string, format: date-time }
        refreshInSeconds: { type: integer, examples: [45] }

    StoreEntryRequest:
      type: object
      required: [token, gateId]
      properties:
        token: { type: string, minLength: 1, maxLength: 2048 }
        gateId: { type: string, minLength: 1, maxLength: 64 }
    StoreEntryResponse:
      type: object
      required: [visitId, user, enteredAt]
      properties:
        visitId: { type: string, format: uuid }
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        enteredAt: { type: string, format: date-time }
    CheckoutWebhookRequest:
      type: object
      required: [eventId, visitId, exitedAt, items]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 100, description: ID único del evento del proveedor de cámaras }
        visitId: { type: string, format: uuid }
        exitedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [quantity]
            description: Requiere `productId` o `barcode` (400 `ITEM_CODE_REQUIRED`); si vienen ambos se usa `productId`.
            properties:
              productId: { type: string, minLength: 1, maxLength: 64, description: SKU (o usar barcode) }
              barcode: { type: string, minLength: 1, maxLength: 64 }
              quantity: { type: integer, minimum: 1, maximum: 999 }
    CheckoutWebhookResponse:
      type: object
      required: [visitId, saleId, folio, totalAmount, paymentStatus]
      properties:
        visitId: { type: string, format: uuid }
        saleId: { type: [string, 'null'], format: uuid }
        folio: { type: [integer, 'null'] }
        totalAmount: { $ref: '#/components/schemas/Money' }
        paymentStatus:
          description: null si la visita se cerró sin venta
          anyOf:
            - { $ref: '#/components/schemas/PaymentStatus' }
            - { type: 'null' }
    SimulatedVisit:
      type: object
      required: [customer, visitId, saleId, folio, totalAmount, paymentStatus, itemCount]
      properties:
        customer:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        visitId: { type: string, format: uuid }
        saleId: { type: [string, 'null'], format: uuid }
        folio: { type: [integer, 'null'] }
        totalAmount: { $ref: '#/components/schemas/Money' }
        paymentStatus:
          anyOf:
            - { $ref: '#/components/schemas/PaymentStatus' }
            - { type: 'null' }
        itemCount: { type: integer, description: Piezas totales que se llevó }

    Category:
      type: object
      required: [id, name, color, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: [string, 'null'] }
        sortOrder: { type: integer }
    CategoryUpdate:
      type: object
      minProperties: 1
      description: Cualquier subconjunto de CategoryInput. Los campos omitidos conservan su valor.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: [string, 'null'] }
        sortOrder: { type: integer }
    CategoryInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: [string, 'null'] }
        sortOrder: { type: integer, default: 0 }

    ProductStatus: { type: string, enum: [ACTIVE, INACTIVE, DISCONTINUED] }
    Product:
      type: object
      required: [id, name, category, price, purchaseCost, taxRate, stock, minStockAlert, status, isLowStock, isQuickAccess, createdAt, updatedAt]
      properties:
        id: { type: string, description: SKU }
        barcode: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        price: { $ref: '#/components/schemas/Money' }
        purchaseCost: { $ref: '#/components/schemas/Money' }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        stock: { type: integer }
        minStockAlert: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        imageUrl: { type: [string, 'null'], format: uri }
        isQuickAccess: { type: boolean }
        isLowStock: { type: boolean, description: 'derivado: stock <= minStockAlert' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductCreate:
      type: object
      required: [id, name, categoryId, price, purchaseCost]
      properties:
        id: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
        barcode: { type: [string, 'null'], maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        price: { $ref: '#/components/schemas/Money' }
        purchaseCost: { $ref: '#/components/schemas/Money' }
        taxRate:
          $ref: '#/components/schemas/TaxRate'
          description: Si se omite, se usa `defaultTaxRate` de `/settings` (0.16 si la tienda no está configurada).
        initialStock: { type: integer, minimum: 0, default: 0, description: Genera movimiento RESTOCK }
        minStockAlert: { type: integer, minimum: 0, default: 5 }
        status: { $ref: '#/components/schemas/ProductStatus', default: ACTIVE }
        imageUrl: { type: [string, 'null'], format: uri }
        isQuickAccess: { type: boolean, default: false }
    ProductUpdate:
      type: object
      minProperties: 1
      description: Todos los campos de ProductCreate excepto id e initialStock, opcionales. Los campos omitidos conservan su valor (no se aplican defaults).
      properties:
        barcode: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        price: { $ref: '#/components/schemas/Money' }
        purchaseCost: { $ref: '#/components/schemas/Money' }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        minStockAlert: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        imageUrl: { type: [string, 'null'], format: uri }
        isQuickAccess: { type: boolean }

    MovementType: { type: string, enum: [SALE, CANCELLATION, RESTOCK, ADJUSTMENT] }
    StockAdjustmentRequest:
      type: object
      required: [type, quantity]
      properties:
        type: { type: string, enum: [RESTOCK, ADJUSTMENT] }
        quantity: { type: integer, description: 'RESTOCK > 0; ADJUSTMENT puede ser negativo (merma)', not: { const: 0 } }
        unitCost: { $ref: '#/components/schemas/Money', description: 'Opcional en RESTOCK: actualiza purchaseCost' }
        note: { type: string, maxLength: 255 }
    InventoryMovement:
      type: object
      required: [id, productId, type, quantityDelta, stockAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        type: { $ref: '#/components/schemas/MovementType' }
        quantityDelta: { type: integer }
        stockAfter: { type: integer }
        saleId: { type: [string, 'null'], format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    InventorySummary:
      type: object
      required: [totalProducts, totalUnits, totalCostValue, totalRetailValue, lowStockCount, outOfStockCount]
      properties:
        totalProducts: { type: integer }
        totalUnits: { type: integer }
        totalCostValue: { $ref: '#/components/schemas/Money', description: 'Σ stock × purchaseCost' }
        totalRetailValue: { $ref: '#/components/schemas/Money', description: 'Σ stock × price' }
        lowStockCount: { type: integer }
        outOfStockCount: { type: integer, description: 'stock <= 0' }
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string, format: uuid }
              name: { type: string }
              units: { type: integer }
              costValue: { $ref: '#/components/schemas/Money' }

    SaleType: { type: string, enum: [AUTOMATED, MANUAL] }
    PaymentMethod: { type: string, enum: [CASH, CARD, TRANSFER, CARD_ON_FILE] }
    PaymentStatus: { type: string, enum: [PAID, PENDING, FAILED, REFUNDED] }
    SaleStatus: { type: string, enum: [COMPLETED, CANCELLED] }
    SaleItem:
      type: object
      required: [id, productId, productName, quantity, unitPrice, taxRate, subtotal]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        subtotal: { $ref: '#/components/schemas/Money' }
    SaleSummary:
      type: object
      required: [id, folio, dateTime, saleType, paymentMethod, paymentStatus, status, totalAmount, itemCount]
      properties:
        id: { type: string, format: uuid }
        folio: { type: integer }
        dateTime: { type: string, format: date-time }
        saleType: { $ref: '#/components/schemas/SaleType' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        status: { $ref: '#/components/schemas/SaleStatus' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        itemCount: { type: integer, description: Piezas totales del ticket }
        customer:
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
    SaleDetail:
      allOf:
        - { $ref: '#/components/schemas/SaleSummary' }
        - type: object
          required: [items, subtotal, taxAmount]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SaleItem' } }
            subtotal: { $ref: '#/components/schemas/Money' }
            taxAmount: { $ref: '#/components/schemas/Money' }
            cashReceived: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            changeGiven: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            paymentReference: { type: [string, 'null'] }
            cashier: { oneOf: [{ type: 'null' }, { type: object, properties: { id: { type: string }, name: { type: string } } }] }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancelReason: { type: [string, 'null'] }
    ManualSaleRequest:
      type: object
      required: [items, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1 }
        paymentMethod: { type: string, enum: [CASH, CARD, TRANSFER] }
        cashReceived: { $ref: '#/components/schemas/Money', description: Requerido si CASH }
        paymentReference: { type: string, description: Folio de terminal o transferencia }
        customerId: { type: [string, 'null'], format: uuid }
    CancelSaleRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255 }
    PurchaseHistory:
      type: object
      required: [groups, meta]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [date, totalAmount, sales]
            properties:
              date: { type: string, format: date }
              totalAmount: { $ref: '#/components/schemas/Money' }
              sales: { type: array, items: { $ref: '#/components/schemas/SaleDetail' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    Receipt:
      type: object
      required: [business, sale, taxBreakdown, printedAt]
      properties:
        business:
          type: object
          required: [name, legalName, rfc, address, phone, logoUrl, footer]
          properties:
            name: { type: string }
            legalName: { type: [string, 'null'] }
            rfc: { type: [string, 'null'] }
            address: { type: string }
            phone: { type: [string, 'null'] }
            logoUrl: { type: [string, 'null'] }
            footer: { type: [string, 'null'] }
        sale: { $ref: '#/components/schemas/SaleDetail' }
        taxBreakdown:
          type: array
          items:
            type: object
            required: [rate, base, tax]
            properties:
              rate: { $ref: '#/components/schemas/TaxRate' }
              base: { $ref: '#/components/schemas/Money' }
              tax: { $ref: '#/components/schemas/Money' }
        printedAt: { type: string, format: date-time }

    ReportSummary:
      type: object
      required: [from, to, revenue, taxCollected, netProfit, transactions, averageTicket, byType, pendingPayments]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        revenue: { $ref: '#/components/schemas/Money', description: 'Σ total_amount (COMPLETED)' }
        taxCollected: { $ref: '#/components/schemas/Money' }
        netProfit: { type: number, description: 'Σ base − Σ unit_cost×qty' }
        transactions: { type: integer }
        averageTicket: { $ref: '#/components/schemas/Money' }
        byType:
          type: object
          required: [AUTOMATED, MANUAL]
          properties:
            AUTOMATED: { type: object, required: [revenue, transactions], properties: { revenue: { $ref: '#/components/schemas/Money' }, transactions: { type: integer } } }
            MANUAL: { type: object, required: [revenue, transactions], properties: { revenue: { $ref: '#/components/schemas/Money' }, transactions: { type: integer } } }
        pendingPayments: { $ref: '#/components/schemas/Money', description: 'Σ ventas con paymentStatus FAILED/PENDING' }
    TrendPoint:
      type: object
      required: [bucket, revenue, netProfit, transactions]
      properties:
        bucket: { type: string, format: date-time }
        revenue: { $ref: '#/components/schemas/Money' }
        netProfit: { type: number }
        transactions: { type: integer }
    TopProduct:
      type: object
      required: [productId, name, quantity, revenue, netProfit]
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        revenue: { $ref: '#/components/schemas/Money' }
        netProfit: { type: number }

    Peripherals:
      type: object
      description: Cada dispositivo es opcional (ausente = sin configurar).
      properties:
        printer:
          type: object
          required: [connection, address, paperWidthMm]
          description: Impresora térmica ESC/POS. La prueba de impresión la hace el navegador (WebUSB / Web Bluetooth).
          properties:
            connection: { type: string, enum: [BLUETOOTH, NETWORK, USB, NONE] }
            address: { type: [string, 'null'], maxLength: 100, description: 'MAC, IP:puerto o vendorId:productId (hex, p. ej. 0416:5011)' }
            paperWidthMm: { type: integer, enum: [58, 80] }
        barcodeScanner:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [KEYBOARD_WEDGE, BLUETOOTH, CAMERA] }
        cardTerminal:
          type: object
          required: [provider, terminalId]
          properties:
            provider: { type: [string, 'null'], maxLength: 50 }
            terminalId: { type: [string, 'null'], maxLength: 50 }
    StoreSettings:
      type: object
      required: [businessName, legalName, rfc, address, phone, logoUrl, currency, defaultTaxRate, pricesIncludeTax, ticketFooter, peripherals]
      properties:
        businessName: { type: string }
        legalName: { type: [string, 'null'] }
        rfc: { type: [string, 'null'] }
        address: { type: string }
        phone: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'], format: uri }
        currency: { type: string, const: MXN }
        defaultTaxRate: { $ref: '#/components/schemas/TaxRate' }
        pricesIncludeTax: { type: boolean, const: true }
        ticketFooter: { type: [string, 'null'] }
        peripherals: { $ref: '#/components/schemas/Peripherals' }
        updatedAt: { type: string, format: date-time, description: Ausente si la tienda aún no se configuró }
    StoreSettingsUpdate:
      type: object
      minProperties: 1
      description: Cualquier subconjunto de StoreSettings excepto currency, pricesIncludeTax y updatedAt.
      properties:
        businessName: { type: string, minLength: 1, maxLength: 150 }
        legalName: { type: [string, 'null'], maxLength: 200 }
        rfc:
          type: [string, 'null']
          pattern: '^[A-Za-zÑñ&]{3,4}[0-9]{6}[A-Za-z0-9]{3}$'
          description: 12 caracteres (persona moral) o 13 (persona física); se guarda en mayúsculas
        address: { type: string, minLength: 1, maxLength: 500 }
        phone: { type: [string, 'null'], maxLength: 20 }
        logoUrl: { type: [string, 'null'], format: uri, maxLength: 500 }
        defaultTaxRate: { $ref: '#/components/schemas/TaxRate' }
        ticketFooter: { type: [string, 'null'], maxLength: 500 }
        peripherals: { $ref: '#/components/schemas/Peripherals' }

    ShelfEventStatus: { type: string, enum: [APPLIED, PENDING_REVIEW, NO_CHANGE, REJECTED] }
    ShelfAction: { type: string, enum: [REMOVED, ADDED, MOVED, NONE] }
    ShelfReviewReason: { type: string, enum: [VISION_UNAVAILABLE, VISION_ERROR, UNKNOWN_PRODUCT, LOW_CONFIDENCE, QUANTITY_TOO_HIGH, INSUFFICIENT_STOCK, NOT_IN_CART] }
    ShelfEventCreateRequest:
      type: object
      required: [cameraId, beforeImage, afterImage]
      properties:
        cameraId: { type: string, minLength: 1, maxLength: 64, examples: [iphone-repisa-1] }
        capturedAt: { type: string, format: date-time }
        changeRatio: { type: number, minimum: 0, maximum: 1, description: Fracción de la imagen que cambió (detector del teléfono) }
        beforeImage: { type: string, minLength: 100, maxLength: 4200000, description: 'JPEG/PNG/WebP como data URL o base64; máx. 3 MB' }
        afterImage: { type: string, minLength: 100, maxLength: 4200000, description: 'JPEG/PNG/WebP como data URL o base64; máx. 3 MB' }
    ShelfEvent:
      type: object
      required: [id, cameraId, status, action, product, quantity, confidence, reviewReason, note, model, changeRatio, movementId, visitId, capturedAt, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        cameraId: { type: string }
        status: { $ref: '#/components/schemas/ShelfEventStatus' }
        action: { $ref: '#/components/schemas/ShelfAction' }
        product:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
        quantity: { type: integer, minimum: 0 }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reviewReason:
          oneOf:
            - { $ref: '#/components/schemas/ShelfReviewReason' }
            - { type: 'null' }
        note: { type: [string, 'null'], description: Explicación del modelo o del error }
        model: { type: [string, 'null'] }
        changeRatio: { type: [number, 'null'], minimum: 0, maximum: 1 }
        movementId: { type: [string, 'null'], format: uuid }
        visitId: { type: [string, 'null'], format: uuid, description: 'Visita a cuyo carrito se aplicó; null = movimiento de inventario' }
        capturedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    ShelfEventDetail:
      allOf:
        - { $ref: '#/components/schemas/ShelfEvent' }
        - type: object
          required: [beforeImage, afterImage]
          properties:
            beforeImage: { type: string, description: data URL }
            afterImage: { type: string, description: data URL }
    ShelfEventConfirmRequest:
      type: object
      required: [action, productId, quantity]
      properties:
        action: { type: string, enum: [REMOVED, ADDED] }
        productId: { type: string, minLength: 1, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    ShelfVisionStatus:
      type: object
      required: [visionEnabled, model, autoApplyConfidence, maxAutoQuantity]
      properties:
        visionEnabled: { type: boolean }
        model: { type: [string, 'null'] }
        autoApplyConfidence: { type: number, minimum: 0, maximum: 1 }
        maxAutoQuantity: { type: integer, minimum: 1 }
    VisitCartLine:
      type: object
      required: [productId, name, quantity, unitPrice, subtotal]
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money', description: IVA incluido }
        subtotal: { $ref: '#/components/schemas/Money' }
    VisitCart:
      type: object
      required: [visitId, enteredAt, customer, items, itemCount, total]
      properties:
        visitId: { type: string, format: uuid }
        enteredAt: { type: string, format: date-time }
        customer:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/VisitCartLine' } }
        itemCount: { type: integer, minimum: 0 }
        total: { $ref: '#/components/schemas/Money' }
    CurrentVisit:
      type: object
      required: [visit]
      properties:
        visit:
          oneOf:
            - { $ref: '#/components/schemas/VisitCart' }
            - { type: 'null' }
    VisitCheckout:
      allOf:
        - { $ref: '#/components/schemas/CheckoutWebhookResponse' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/VisitCartLine' } }
    ProductIdentifyRequest:
      type: object
      required: [image]
      properties:
        image: { type: string, minLength: 100, maxLength: 4200000, description: 'JPEG/PNG/WebP como data URL o base64; máx. 3 MB' }
    ProductIdentification:
      type: object
      required: [product, confidence, reason, model]
      properties:
        product:
          oneOf:
            - { $ref: '#/components/schemas/Product' }
            - { type: 'null' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
        model: { type: [string, 'null'] }
